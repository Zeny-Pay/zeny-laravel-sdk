name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  attribution:
    name: No AI contributors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-attribution.sh

  verify:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["12", "13"]
        include:
          - laravel: "12"
            testbench: "^10.0"
          - laravel: "13"
            testbench: "^11.0"
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: "8.2"
            laravel: "13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict --no-check-lock
      - name: Pin the Laravel version
        run: |
          composer require --no-interaction --no-update "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --no-interaction --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer typecheck
      - run: composer check:generated
      - run: vendor/bin/pest --coverage --min=90
      - run: composer audit
